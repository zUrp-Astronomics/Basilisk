# SOURCE: scaffold LCARS (priv/catalogue/project_template/main/), réécrit en CI réelle
# AUTHOR: engineer
# DATE: 2026-09-23
# STATUS: actif — la suite du projet ; la sonde probe-test-relevance.yml rejoue le job `test`
name: CI

# Quatre jobs, et plus aucun placeholder. Chaque étape appelle le script d'entrée d'un composant, qui
# vit dans ce composant et résout ses chemins depuis sa propre place : la CI ne connaît de l'arbre que
# le nom de ces scripts.
#   - `test`  : les tests de la page de banc (5_App/run.sh — la première commande de `## Test` du
#               CLAUDE.md) : test_app_vm.cjs, test_app.js ; puis le test de l'outil tool_station
#               (5_App/tool_station/run.sh) ;
#   - `indi`  : le driver INDI 6_Driver/indi/ compilé ET lié par son CMakeLists.txt (6_Driver/indi/build.sh),
#               puis ce que démontre 6_Driver/indi/test.sh : l'amont et ses deux séries de patchs, le style
#               d'indilib, les trois états joués contre un faux contrôleur Pinefeat et une fausse carte Basilisk ;
#               contre la libindi-dev 2 du PPA d'INDI, sur Ubuntu 26.04 ;
#   - `firmware` : le firmware : ses en-têtes partagés compilés, le faux
#               Samyang AF 135 compilé, ses tests de comportements et de pannes, son rejeu contre
#               les traces de l'objectif (4_Firmware/run.sh) ;
#   - `firmware-build` : le firmware construit par ESP-IDF 5.3.2 pour sa cible, esp32c3 (la carte
#               v1.0), console muette vérifiée sur le build (4_Firmware/build.sh).
#
# ⚠ LE WORKFLOW S'APPELLE `CI` ET DOIT LE RESTER. Gitea compose le contexte d'un statut ainsi :
# `<workflow> / <job> (<déclencheur>)` → `CI / test (push)`, `CI / firmware-build (pull_request)`…
# tous sous le glob `CI / *` exigé par la protection de `main`. L'ancien job `no-harness-yet` a
# disparu exprès : sa disparition est le signal, lu par la fleet, que le projet a posé sa suite.
#
# ⚠ POURQUOI `container:` ET PAS `runs-on: <label-gras>`. Le label `shell` est le contrat MINIMAL
# que tout runner LCARS sert (le déploiement de référence le mappe sur `alpine:3.20` — pas de node,
# pas de git, pas de bash). `container:` fait tirer l'image nommée quelle que soit la config du
# label ; le runner la cache, seul le premier job d'un runner neuf paie le téléchargement.
#
# ⚠ AUCUN JOB NE SE NEUTRALISE POUR OBTENIR LE VERT : ni `continue-on-error`, ni `|| true`, ni
# `if: false`. Un vert obtenu en masquant un job, ou en compilant la mauvaise configuration, est pire
# que pas de CI.
#
# Le runner joue le `ci.yml` du commit TESTÉ : corriger ce fichier dans sa branche et repousser
# suffit, rien à merger d'abord.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Suite hôte ──
  # Image de référence de gitea/act : node (donc `actions/checkout@v4`), python3, bash, git, gcc.
  # ⚠ LA SONDE (probe-test-relevance.yml) DOIT TOURNER DANS LA MÊME IMAGE ET LE MÊME OUTILLAGE
  # (.gitea/setup_host.sh) : changer l'un ici, c'est changer l'autre là-bas dans le même geste.
  test:
    runs-on: shell
    container: catthehacker/ubuntu:act-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /opt/pw-browsers
            node_modules
          key: playwright-${{ hashFiles('package.json') }}
      # gcc, le module playwright (node_modules/ à la racine) et Chromium sous /opt/pw-browsers —
      # hors de $HOME, pour que la sonde les trouve aussi sous `env -i` avec un HOME vierge.
      - name: Outillage (gcc, Playwright, Chromium)
        run: bash .gitea/setup_host.sh
      - name: Tests de la page de banc (5_App/run.sh)
        run: bash 5_App/run.sh
      - name: Test de l'outil tool_station (5_App/tool_station/run.sh)
        run: bash 5_App/tool_station/run.sh

  # ── Driver INDI ──
  # 6_Driver/indi/build.sh compile ET lie le driver par son CMakeLists.txt, tel que son README le prescrit (cmake puis
  # make) ; 6_Driver/indi/test.sh démontre ce que dit son README (§ Ce que la CI démontre) : le driver est l'amont nommé
  # puis ses deux séries de patchs, au style d'indilib, et les trois états (l'amont, l'amont et les correctifs, le
  # driver) joués sous libindi contre un faux contrôleur Pinefeat, le driver aussi contre une fausse carte Basilisk.
  # Ce script n'est pas dans `## Test` du CLAUDE.md : la sonde (probe-test-relevance.yml) rejoue `## Test` dans l'image
  # du job `test`, où libindi 2 n'existe pas.
  # ⚠ INDI 2, PAR LE PPA D'INDI (ppa:mutlaqja/ppa), PAS LA libindi-dev D'UBUNTU (décision de l'humain, ticket #645 : on
  # ne construit pas pour 1.9.9, on ne compile pas INDI). Le PPA ne publie libindi 2 (2.2.5 au 2026-10-19) que pour
  # Ubuntu 26.04 (resolute) : d'où l'image `ubuntu:26.04`, étiquette fixe. Le PPA, lui, remplace ses paquets à chaque
  # construction : la version jugée est celle qu'il sert le jour du run, écrite au journal. Sa clé est prise au serveur
  # de clés d'Ubuntu et refusée si son empreinte n'est pas celle que Launchpad publie pour ce PPA (ci-dessous). Ni node
  # ni git dans l'image, donc pas d'`actions/checkout` : git vient d'apt, puis un clone manuel (ci-dessous).
  indi:
    runs-on: shell
    container: ubuntu:26.04
    defaults:
      run:
        shell: bash
    steps:
      # pkg-config et make sont nommés : CMakeLists.txt passe par pkg-config (libindi-dev n'expédie pas de
      # FindINDI.cmake), et make n'est qu'une recommandation de cmake, que --no-install-recommends ne tire pas.
      - name: Outillage (git, cmake, make, g++, pkg-config, astyle, python3, libindi-dev 2 du PPA d'INDI)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl gpg git cmake make g++ pkg-config \
            astyle python3 >/dev/null
          empreinte=F81D4F8C16975C8882D7B38333E72D44A5F2E962
          curl -fsS "https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0x$empreinte" -o /tmp/indi-ppa.asc
          lue=$(gpg --show-keys --with-colons /tmp/indi-ppa.asc | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ "$lue" != "$empreinte" ]; then echo "clé du PPA : empreinte $lue, attendue $empreinte" >&2; exit 1; fi
          gpg --dearmor < /tmp/indi-ppa.asc > /usr/share/keyrings/indi-ppa.gpg
          printf '%s\n' 'Types: deb' 'URIs: https://ppa.launchpadcontent.net/mutlaqja/ppa/ubuntu' 'Suites: resolute' \
            'Components: main' 'Signed-By: /usr/share/keyrings/indi-ppa.gpg' > /etc/apt/sources.list.d/indi-ppa.sources
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libindi-dev >/dev/null
          echo "libindi $(dpkg-query -W -f='${Version}' libindi-dev), $(g++ --version | head -n 1), $(cmake --version | head -n 1), $(astyle --version)"
      # Clone manuel avec le jeton du job (pas d'`actions/checkout`, action JS node20 : ni cette image
      # ni l'image espressif/idf ne garantissent node). Le jeton passe par un en-tête HTTP (comme le
      # fait actions/checkout), jamais dans l'URL : il n'est ni écrit dans .git/config ni recraché
      # par un message d'erreur de git. Le commit récupéré est comparé à GITHUB_SHA : on ne compile
      # jamais un autre commit.
      - name: Récupérer le commit testé
        env:
          FORGE_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FORGE_TOKEN" | base64 -w0)"
          git config --global --add safe.directory '*'
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          recup() { git -c http.extraHeader="$auth" -c protocol.version=2 fetch -q --no-tags --depth=1 origin "$1"; }
          if ! recup "$GITHUB_SHA"; then
            echo "récupération par sha refusée par la forge ; repli sur la ref ${GITHUB_REF}"
            recup "$GITHUB_REF"
          fi
          obtenu=$(git rev-parse FETCH_HEAD)
          if [ "$obtenu" != "$GITHUB_SHA" ]; then
            echo "commit récupéré ${obtenu} ≠ commit testé ${GITHUB_SHA} : on ne compile pas autre chose" >&2
            exit 1
          fi
          git checkout -q --detach FETCH_HEAD
          git log -1 --oneline
      - name: Compiler et lier 6_Driver/indi/ (6_Driver/indi/build.sh)
        run: bash 6_Driver/indi/build.sh
      - name: Démontrer le driver (6_Driver/indi/test.sh)
        run: bash 6_Driver/indi/test.sh

  # ── Firmware, build ESP-IDF ──
  # 4_Firmware/build.sh : le projet ESP-IDF de 4_Firmware/ (PHY réelle, bench_core, app_main), pour
  # sa cible, esp32c3, dans 4_Firmware/build/esp32c3, avec la même récupération du commit que le job
  # `indi` ; il échoue si le build ne porte pas la console muette (journal et bootloader à 0). À chaque
  # run, PR comprises, il publie un artefact, `firmware-esp32c3` : le dossier build/esp32c3/artefact/ que
  # build.sh a rempli, à plat (les fichiers basilisk_FW-v<version>-esp32c3…, l'image unique -full.bin,
  # flash_args, flash.sh et flash.cmd).
  # ⚠ ON CHANGE L'UN, ON CHANGE L'AUTRE : le job `build` de .github/workflows/firmware.yml est la copie de ce job pour
  # GitHub (même image, même build.sh, même artefact), dont l'image fusionnée est publiée sur la release d'un tag. Une
  # image, un script ou un artefact changés ici se changent là-bas dans le même commit, et inversement.
  firmware-build:
    runs-on: shell
    container: espressif/idf:v5.3.2
    defaults:
      run:
        shell: bash
    steps:
      # Même récupération que le job `indi` (voir là-bas pourquoi le jeton passe par un en-tête).
      - name: Récupérer le commit testé
        env:
          FORGE_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FORGE_TOKEN" | base64 -w0)"
          git config --global --add safe.directory '*'
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          recup() { git -c http.extraHeader="$auth" -c protocol.version=2 fetch -q --no-tags --depth=1 origin "$1"; }
          if ! recup "$GITHUB_SHA"; then
            echo "récupération par sha refusée par la forge ; repli sur la ref ${GITHUB_REF}"
            recup "$GITHUB_REF"
          fi
          obtenu=$(git rev-parse FETCH_HEAD)
          if [ "$obtenu" != "$GITHUB_SHA" ]; then
            echo "commit récupéré ${obtenu} ≠ commit testé ${GITHUB_SHA} : on ne compile pas autre chose" >&2
            exit 1
          fi
          git checkout -q --detach FETCH_HEAD
          git log -1 --oneline
      # L'image fixe IDF_PATH mais son entrypoint (qui source export.sh) est court-circuité par le
      # runner : on charge l'environnement ESP-IDF nous-mêmes.
      - name: Build ESP-IDF (firmware, esp32c3)
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          bash 4_Firmware/build.sh
      - name: node pour upload-artifact (absent de l'image IDF)
        run: |
          set -euo pipefail
          v=v20.18.0; f=node-$v-linux-x64.tar.xz
          cd /tmp
          curl -fsSLO "https://nodejs.org/dist/$v/$f"
          curl -fsSL "https://nodejs.org/dist/$v/SHASUMS256.txt" | grep " $f\$" | sha256sum -c -
          tar -xJf "$f" -C /usr/local --strip-components=1
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32c3
          path: 4_Firmware/build/esp32c3/artefact/
          if-no-files-found: error

  # ── Firmware ──
  # 4_Firmware/run.sh : les en-têtes partagés du firmware compilés un par un, puis le faux
  # Samyang AF 135 compilé sans avertissement, ses tests (comportements de la référence, pannes
  # reçues et émises) et son rejeu contre les traces de l'objectif. gcc seul suffit.
  # ⚠ IMAGE `ubuntu:24.04`, étiquette fixe : le compilateur jugé (gcc 13 de noble) ne change pas sans commit, et
  # -Werror ne rougit pas sur une montée d'image.
  # Ni node ni git dans l'image : git vient d'apt, puis le même clone manuel que le job `indi`.
  firmware:
    runs-on: shell
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Outillage (git, gcc)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git gcc libc6-dev >/dev/null
          gcc --version | head -n 1
      # Même récupération que le job `indi` (voir là-bas pourquoi le jeton passe par un en-tête).
      - name: Récupérer le commit testé
        env:
          FORGE_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FORGE_TOKEN" | base64 -w0)"
          git config --global --add safe.directory '*'
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          recup() { git -c http.extraHeader="$auth" -c protocol.version=2 fetch -q --no-tags --depth=1 origin "$1"; }
          if ! recup "$GITHUB_SHA"; then
            echo "récupération par sha refusée par la forge ; repli sur la ref ${GITHUB_REF}"
            recup "$GITHUB_REF"
          fi
          obtenu=$(git rev-parse FETCH_HEAD)
          if [ "$obtenu" != "$GITHUB_SHA" ]; then
            echo "commit récupéré ${obtenu} ≠ commit testé ${GITHUB_SHA} : on ne compile pas autre chose" >&2
            exit 1
          fi
          git checkout -q --detach FETCH_HEAD
          git log -1 --oneline
      - name: firmware (en-têtes, faux 135, tests de pannes, rejeu)
        run: bash 4_Firmware/run.sh

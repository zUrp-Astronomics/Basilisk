<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>emount-bench</title>
<style>
:root{
  --bg:#14171a; --panel:#1c2126; --panel2:#232a30; --line:#2f3841; --ink:#e6ebef; --ink2:#9aa7b2;
  --acc:#4fd1a5; --acc2:#f0b35a; --bad:#f07a6a; --tx:#8ab4f8; --rx:#4fd1a5; --ev:#f0b35a;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
  --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;display:grid;grid-template-rows:auto 1fr;gap:0}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.02em}
header .sub{color:var(--ink2);font-size:12px}
.spacer{flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:#555;display:inline-block;margin-right:6px}
.dot.on{background:var(--acc)}
main{display:grid;grid-template-columns:400px minmax(0,1fr);gap:0;min-height:0}
aside{border-right:1px solid var(--line);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px;background:var(--panel)}
section.box{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px}
section.box h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
button{background:#2b333b;color:var(--ink);border:1px solid #3b4650;border-radius:4px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{background:#354049}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--acc);color:#0d1a15;border-color:transparent;font-weight:600}
button.warn{border-color:var(--acc2);color:var(--acc2)}
button.danger{border-color:var(--bad);color:var(--bad)}
input[type=text],input[type=number],select{background:#12161a;color:var(--ink);border:1px solid #3b4650;border-radius:4px;padding:6px 8px;font:inherit}
input[type=number]{width:96px}
.slider{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:6px 0}
.slider input[type=range]{width:100%;accent-color:var(--acc);cursor:pointer}
.slider .val{font-family:var(--mono);font-size:13px;color:var(--ink);min-width:88px;text-align:right}
.slider .scale{grid-column:1;position:relative;height:26px;font-family:var(--mono);font-size:10px;color:var(--ink2)}
.slider .scale span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;text-align:center}
.slider .scale span:nth-child(2){transform:none;text-align:left}
.slider .scale span:last-child{transform:translateX(-100%);text-align:right}
.stops{grid-column:1;position:relative;height:14px;font-family:var(--mono);font-size:10px;color:var(--ink2)}
.stops span{position:absolute;top:0;transform:translateX(-50%)}
.stops span:first-child{transform:none}.stops span:last-child{transform:translateX(-100%)}
.slider.pending .val{color:var(--acc2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-family:var(--mono);font-size:12px}
.kv b{color:var(--ink2);font-weight:500}
.kv span{color:var(--ink)}
.big{font-family:var(--mono);font-size:22px;color:var(--acc);margin:4px 0}
.content{display:grid;grid-template-rows:auto 1fr auto;min-height:0}
.toolbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.toolbar label{color:var(--ink2);font-size:12px;display:flex;align-items:center;gap:4px}
#log{overflow:auto;font-family:var(--mono);font-size:12px;padding:6px 12px;line-height:1.45}
.l{white-space:pre-wrap;word-break:break-all;border-bottom:1px solid #1e2429;padding:1px 0}
.l .t{color:#6c7883;margin-right:8px}
.l.tx{color:var(--tx)} .l.rx{color:var(--rx)} .l.ev{color:var(--ev)} .l.err{color:var(--bad)} .l.ok{color:#c9d1d9} .l.cmd{color:#fff;background:#232a30}
.l .dec{color:#d9e2ea}
.l .fld{color:#ffd580}
.l .n{color:var(--acc2);font-weight:600;margin-left:6px}
.cli{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
.cli input{flex:1;font-family:var(--mono)}
.hint{color:var(--ink2);font-size:12px}
.note{background:#2b2320;border:1px solid #5a4a2e;color:#f3d9a4;padding:8px 10px;border-radius:6px;font-size:12px}
details summary{cursor:pointer;color:var(--ink2);font-size:12px}
#btnLang span{color:var(--ink2)}
#btnLang span.on{color:var(--acc);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>emount-bench</h1>
  <span class="sub" data-i18n="hdr.sub"></span>
  <span class="spacer"></span>
  <span id="connDot" class="dot"></span><span id="connTxt" class="hint"></span>
  <button id="btnConnect" class="primary" data-i18n="btn.connect"></button>
  <button id="btnDisconnect" disabled data-i18n="btn.disconnect"></button>
  <button id="btnLang" data-i18n-title="lang.title"><span data-lang="fr">FR</span> | <span data-lang="en">EN</span></button>
</header>
<main>
<aside>
  <div class="note" id="serialNote" hidden data-i18n="note.noSerial"></div>

  <section class="box">
    <h2><span data-i18n="box.lens"></span> <span class="hint" id="s_state">—</span></h2>
    <div class="kv">
      <b data-i18n="kv.identity"></b><span id="s_id">—</span>
      <b data-i18n="kv.letters"></b><span id="s_caps">—</span>
      <b data-i18n="kv.board"></b><span id="s_board">—</span>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="btnReboot" class="warn" data-i18n-title="tip.reboot" data-i18n="btn.reboot"></button>
      <button id="btnPowerOff" class="danger" data-i18n-title="tip.powerOff" data-i18n="btn.powerOff"></button>
      <button id="btnPowerOn" data-i18n-title="tip.powerOn" data-i18n="btn.powerOn"></button>
      <span class="hint" id="s_power"></span>
    </div>
  </section>

  <section class="box" id="secAir">
    <h2 data-i18n="box.sensor"></h2>
    <div class="kv">
      <b data-i18n="kv.temp"></b><span id="s_temp">—</span>
      <b data-i18n="kv.rh"></b><span id="s_rh">—</span>
      <b id="k_cond"></b><span id="s_cond">—</span>
    </div>
  </section>

  <section class="box" id="secFocus">
    <h2 data-i18n="box.focus"></h2>
    <div class="big"><span id="s_focus">—</span> <span class="hint" data-i18n="unit.steps"></span> <span class="hint" id="s_moving"></span></div>
    <div class="hint" id="s_move" style="color:var(--bad)"></div>
    <div class="row">
      <button id="btnFm100">−100</button><button id="btnFm10">−10</button>
      <button id="btnFp10">+10</button><button id="btnFp100">+100</button>
      <button id="btnStop" class="danger" data-i18n-title="tip.stop" data-i18n="btn.stop"></button>
      <button id="btnMarkSet" data-i18n-title="tip.markSet" data-i18n="btn.markSet"></button>
      <button id="btnMarkGo" data-i18n-title="tip.markGo" data-i18n="btn.markGo"></button>
    </div>
    <div class="slider" id="focusSlider">
      <input type="range" id="focusRange" min="0" max="65535" step="1" value="0" disabled>
      <span class="val" id="focusRangeVal">—</span>
      <div class="scale"><span id="scHome" style="left:0;top:0;color:var(--acc);display:none">▲ ∞</span><span id="scMark" style="left:0;top:0;color:var(--warn,#c80);display:none" data-i18n="scale.mark"></span><span id="scMin" style="left:0;top:13px"></span><span id="scMax" style="left:100%;top:13px"></span></div>
    </div>
    <div class="row">
      <input type="number" id="focusTarget" value="0" min="0" max="65535">
      <button id="btnFgoto" data-i18n="btn.goto"></button>
    </div>
    <div class="hint" id="focusHint"></div>
  </section>

  <section class="box" id="secIris">
    <h2><span data-i18n="box.iris"></span> <span class="hint" id="irisBy"></span></h2>
    <div class="big"><span id="s_fnum">f/—</span> <span class="hint" id="s_irange">—</span></div>
    <div class="slider" id="irisSlider">
      <input type="range" id="irisRange" min="0" max="21" step="1" value="0">
      <span class="val" id="irisRangeVal">f/—</span>
      <div class="stops"></div>
    </div>
    <div class="row">
      <button id="btnIopen" data-i18n="btn.irisOpen"></button>
      <button id="btnIm">−⅓</button><button id="btnIp">+⅓</button>
    </div>
    <div class="hint" data-i18n="iris.hint"></div>
  </section>

  <details id="bench">
  <summary class="hint" data-i18n="bench.summary"></summary>
  <section class="box">
    <div class="hint" id="s_t">—</div>
  </section>
  </details>
</aside>

<div class="content">
  <div class="toolbar">
    <label><input type="checkbox" id="fPoll" checked> <span data-i18n="log.showPoll"></span></label>
    <label><input type="checkbox" id="fFrames" checked> <span data-i18n="log.decode"></span></label>
    <span class="spacer"></span>
    <button id="btnLogOn" data-i18n-title="tip.logOn">LOG ON</button>
    <button id="btnLogAll" data-i18n-title="tip.logAll">LOG ALL</button>
    <button id="btnLogOff" data-i18n-title="tip.logOff">LOG OFF</button>
    <button id="btnClear" data-i18n="btn.clear"></button>
    <button id="btnExport" data-i18n="btn.export"></button>
  </div>
  <div id="log"></div>
  <form class="cli" id="cli">
    <input type="text" id="cliIn" data-i18n-placeholder="cli.placeholder" autocomplete="off">
    <button type="submit" data-i18n="btn.send"></button>
  </form>
</div>
</main>

<script>
'use strict';
/* ───────────── Langue de l'interface : FR / EN ─────────────
 * TEXTS : chaque texte que la page ecrit pour l'humain, une cle, [francais, anglais] sur une ligne. Les textes restent
 * dans la page (pas de fichier voisin) : ouverte en file://, Chrome refuse d'en lire un. Ne se traduisent pas : le
 * protocole (lignes envoyees et recues, leurs jetons, les noms et champs des trames, NAMES) et les donnees d'objectifs
 * (LENS_NAMES, LENS_BRANDS : le dictionnaire n'entre jamais entre leurs marqueurs, que gen_lens_names.py reecrit).
 * {0}, {1}… : les valeurs inserees. La langue : le choix retenu (localStorage), sinon celle du navigateur (fr… -> FR,
 * toute autre ou absente -> EN). La bascule reecrit l'interface sur place ; le journal est un releve : ses lignes
 * restent dans la langue ou elles ont ete ecrites. */
const LANGS=['fr','en'];
/* Les nombres et les heures suivent la langue. en-GB et non en-US : l'heure du journal en 24 h sans dependre de ce que
 * hour12:false donne pour une locale en 12 h. */
const LOCALES={fr:'fr-FR',en:'en-GB'};
const TEXTS={
 'hdr.sub':["objectif Sony E · un protocole (PROTOCOL.md) · poll 5 Hz","Sony E lens · one protocol (PROTOCOL.md) · 5 Hz poll"],
 'lang.title':["Langue de l'interface : français (cliquer pour l'anglais)","Interface language: English (click for French)"],
 'conn.off':["déconnecté","disconnected"],
 'conn.opening':["connexion…","connecting…"],
 'conn.on':["connecté","connected"],
 'btn.connect':["Connecter","Connect"],
 'btn.disconnect':["Déconnecter","Disconnect"],
 'note.noSerial':["Ce navigateur n'a pas Web Serial (Firefox 151 ou plus, Chrome ou Edge, sur ordinateur).","This browser has no Web Serial (Firefox 151 or later, Chrome or Edge, on a computer)."],
 'box.lens':["Objectif","Lens"],
 'kv.identity':["identité","identity"],
 'kv.letters':["lettres","commands"],
 'kv.board':["carte","board"],

 'kv.temp':["température","temperature"],
 'kv.rh':["humidité","humidity"],
 'kv.dew':["point de rosée","dew point"],
 'kv.frost':["point de givre","frost point"],
 'kv.cond':["point de rosée ou de givre","dew or frost point"],
 'unit.celsius':["{0} °C","{0} °C"],
 'unit.rh':["{0} %HR","{0} %RH"],
 'btn.reboot':["Redémarrer l'objectif","Restart lens"],
 'tip.reboot':["b : oublier l'objectif et refaire toute la séquence de démarrage, sans couper l'alim (en fault : coupée puis rétablie, si câblée)","b: forget the lens and redo the whole start-up sequence, without cutting power (in fault: cut then restored, if wired)"],
 'btn.powerOff':["Alim OFF","Power OFF"],
 'tip.powerOff':["p0 : couper les deux alimentations (si câblées)","p0: cut both power rails (if wired)"],
 'btn.powerOn':["Alim ON","Power ON"],
 'tip.powerOn':["p1 : rétablir (l'objectif reboote tout seul)","p1: restore (the lens reboots by itself)"],
 'box.focus':["Focus","Focus"],
 'unit.steps':["pas","steps"],
 'btn.stop':["Stop","Stop"],
 'tip.stop':["q : arrêt du mouvement en cours, ou du retour à la marque qui finit un démarrage ; le homing ne s'interrompt pas (er busy home)","q: stop the current move, or the return to the mark that ends a start-up; homing cannot be interrupted (er busy home)"],
 'btn.markSet':["Marquer","Set mark"],
 'tip.markSet':["js : mémorise la position focus courante comme marque de cet objectif à cette focale (dans la carte) — aussi : bouton du fût tenu 1 à 4 s (mode normal seulement)","js: store the current focus position as the mark of this lens at this focal length (in the board) — also: barrel button held 1 to 4 s (normal mode only)"],
 'btn.markGo':["Aller à la marque","Go to mark"],
 'tip.markGo':["jg : va à la marque — aussi : appui court sur le bouton du fût (mode normal seulement)","jg: go to the mark — also: short press on the barrel button (normal mode only)"],
 'scale.mark':["▲ marque","▲ mark"],
 'scale.unknown':["bornes inconnues","limits unknown"],
 'scale.near':["{0} (proche)","{0} (near)"],
 'scale.far':["{0} (butée)","{0} (end stop)"],
 'limits.unknown':["bornes inconnues ({0})","limits unknown ({0})"],
 'btn.goto':["Aller à","Go to"],
 'focus.hint':["Bornes publiées par l'objectif (r), rien n'est codé en dur.","Limits published by the lens (r), nothing is hard-coded."],
 'focus.hintLimits':["Bornes publiées par l'objectif (r) : {0} – {1}.","Limits published by the lens (r): {0} – {1}."],
 'focus.hintUnknown':["Bornes inconnues : l'objectif n'a pas publié de 0x06 lisible (r).","Limits unknown: the lens has not published a readable 0x06 (r)."],
 'box.iris':["Ouverture","Aperture"],

 'iris.range':["plage {0}–{1}","range {0}–{1}"],
 'btn.irisOpen':["Pleine ouverture","Wide open"],
 'iris.hint':["Tiers de diaph. entre les bornes lues sur l'objectif (a) ; la valeur affichée est celle que l'objectif rapporte (o), pas la consigne.","Third stops between the limits read from the lens (a); the value shown is the one the lens reports (o), not the target."],
 'bench.summary':["Banc — la ligne t de la carte","Bench — the board's t line"],
 'log.showPoll':["afficher le poll (f/e/o…)","show the poll (f/e/o…)"],
 'log.decode':["décoder les trames","decode frames"],
 'tip.logOn':["LOG ON : la carte journalise ce qu'elle fait (« * session », « * motion », « * restore »…) et les trames non périodiques « * rx / * tx »","LOG ON: the board logs what it does (“* session”, “* motion”, “* restore”…) and the non-periodic frames “* rx / * tx”"],
 'tip.logAll':["LOG ALL : chaque trame, les périodiques comprises (0x02, 0x03/0x04, 0x05/0x06 à chaque VD). firmware2 : aucune perdue à 60 Hz, chacune avec son instant ; une trame de la boucle n'y porte que ce qui a changé depuis la précédente de son type (« ~05 60=01 » : l'offset 60 vaut 01 ; « ~03 » seul : identique), la page la reconstruit et la décode ; « * lost » dit des lignes perdues. Firmware v1 : 30 lignes/s au plus, l'excédent est compté","LOG ALL: every frame, periodic ones included (0x02, 0x03/0x04, 0x05/0x06 at each VD). firmware2: none lost at 60 Hz, each with its time; a loop frame carries only what changed since the previous one of its type (“~05 60=01”: offset 60 is 01; “~03” alone: unchanged), the page rebuilds and decodes it; “* lost” reports lost lines. Firmware v1: 30 lines/s at most, the excess is counted"],

 'btn.clear':["Effacer","Clear"],

 'cli.placeholder':["commande (t, f16400, a5.6, DEBUG, :GP#…)","command (t, f16400, a5.6, DEBUG, :GP#…)"],

 'state.absent':["· absent ({0})","· no lens ({0})"],
 'state.fault':["· FAULT","· FAULT"],

 'state.ready':["· prêt","· ready"],
 'caps.ext':["lot étendu (ext={0})","extended set (ext={0})"],

 'board.reset':[" · reset {0}"," · reset {0}"],
 'board.boot':[" · boot {0}"," · boot {0}"],
 'board.lastOp':[" · dernière op. {0}"," · last op. {0}"],
 'power.off':["alims coupées (p0) : p1 ou b pour rétablir","power cut (p0): p1 or b to restore"],
 'move.moving':["· en mouvement","· moving"],
 'move.unknown':["· mouvement ? ({0})","· moving? ({0})"],
 'move.noReply':["pas de réponse","no reply"],
 'move.noG':["pas de réponse à g","no reply to g"],
 'move.stopped':["arrêté","stopped"],
 'move.last':["dernier déplacement : {0}","last move: {0}"],
 'log.moveEnd':["fin du déplacement : {0}","end of move: {0}"],
 'log.lastOp':["dernière opération : {0}","last operation: {0}"],
 'log.lensGone':["objectif disparu","lens gone"],
 'log.moveRefused':["déplacement refusé : {0}","move refused: {0}"],
 'log.irisRangeUnknown':["plage d'ouverture inconnue (a) : rien envoyé","aperture range unknown (a): nothing sent"],
 'log.irisRefused':["ouverture refusée : {0}","aperture refused: {0}"],
 'log.irisUnknown':["ouverture inconnue (o) : ±⅓ impossible","aperture unknown (o): ±⅓ not possible"],
 'log.ready':["prêt : {0}","ready: {0}"],
 'log.firmware':["carte : firmware {0}","board: firmware {0}"],
 'log.mute':["carte muette : aucune réponse à « v » en 12 s — déconnexion","board silent: no reply to “v” in 12 s — disconnecting"],
 'log.linkLost':["liaison perdue","link lost"],
 'log.readErr':["lecture : {0}","read: {0}"],
 'log.qDropped':["q : « {0} » retiré de la file","q: “{0}” removed from the queue"],
 'log.notSent':["« {0} » non envoyée : pas de réponse à la resynchronisation (v)","“{0}” not sent: no reply to the resync (v)"],
 'log.unexpected':["(réponse inattendue à « {0} », ignorée) {1}","(unexpected reply to “{0}”, ignored) {1}"],
 'log.unsolicited':["(non sollicité) {0}","(unsolicited) {0}"],
 'log.timeout':["(pas de réponse en {0} s)","(no reply in {0} s)"],
 'log.lateMoon':["(réponse Moonlite tardive, ignorée) {0}","(late Moonlite reply, ignored) {0}"],
 'dec.noRef':["référence inconnue : trame non reconstruite (LOG ALL la rétablit)","unknown reference: frame not rebuilt (LOG ALL restores it)"],
 'dec.dropped':["trame précédente incomplète ({0}/{1} octets) abandonnée","previous frame incomplete ({0}/{1} bytes), dropped"],
 'dec.fragment':["fragment {0}/{1} ({2} octets reçus)","fragment {0}/{1} ({2} bytes received)"],
 'dec.badCk':["checksum faux","bad checksum"],

 'dec.badFrame':["longueur ou fin invalide","bad length or end byte"]
};
const LANG_KEY='emount-bench.lang';
let LANG=(()=>{ try{ const l=localStorage.getItem(LANG_KEY); if(LANGS.includes(l)) return l; }catch(e){} return /^fr/i.test(navigator.language||'')?'fr':'en'; })();
const loc=()=>LOCALES[LANG];
/* Le texte d'une cle dans la langue courante ; une cle absente s'affiche telle quelle (test_app.js les veut toutes). */
function tr(k,...a){ const v=TEXTS[k]; return v?v[LANGS.indexOf(LANG)].replace(/\{(\d)\}/g,(_,i)=>a[i]):k; }
/* ───────────── Tables de messages (Samyang AF135, rapport 01) ─────────────
 * 0x1B deplace l'iris sur le 135
 * (7_Docs/E-Mount/samyang.md § 4.9), 0x02 est le refus (7_Docs/E-Mount/tamron.md § 2.3), 0x1F n'a pas de
 * role etabli (msg1F). */
const NAMES={0x01:'capabilities',0x02:'refus',0x03:'body-control',0x04:'frame-tick',0x05:'status-main',0x06:'status-focus',
 0x07:'init7',0x08:'body-info',0x09:'init9',0x0A:'info-groups',0x0B:'initB',0x0C:'speed-change',0x0D:'frame-rate',0x10:'homing',
 0x14:'FW-UPDATE-ARM',0x15:'FW-UPDATE-DATA',0x16:'sleep',0x17:'status17',0x19:'msg19',0x1B:'iris-move',0x1C:'af-stop',

/* Mise en page du flux (objectif -> boitier) : la longueur du 0x05 et du 0x06 n'est pas une
 * constante. L'objectif la recalcule a chaque 0x0A d'apres ses masques (7_Docs/E-Mount/samyang.md
 * § 2.3, protocol.md § 7.5 : 0x05 de 109 octets avant tout 0x0A, 97 et 40 avec le masque de la carte ; un
 * FE 24-105 donne aussi 97). La page ne refait pas ce calcul : elle lit la mise en page sur les trames. Le
 * 0x05 et le 0x06 ouvrent leur trame, et seuls des accuses (1D 1F 22 2E 1C 3C, trois au plus)
 * suivent le 0x06 (samyang.md § 4.4) : la zone utile la plus courte d'une trame qui commence par l'un
 * d'eux, depuis le dernier 0x0A vu, est sa longueur. Un 0x0A vu (* tx ou * rx) l'oublie. */

  }

/* Pavage par la table de tailles et la mise en page lue (LAYOUT), sinon toute la zone utile est
 * UN message (marque untiled), jamais lu au-dela de la zone utile. */
function decodeFrame(bytes, dir){
  if(bytes.length<8||bytes[0]!==0xF0) return null;
  const len=bytes[1]|(bytes[2]<<8);
  if(len!==bytes.length||bytes[len-1]!==0x55) return {err:tr('dec.badFrame')};
  let ck=0; for(let i=1;i<len-3;i++) ck=(ck+bytes[i])&0xFFFF;
  const got=bytes[len-3]|(bytes[len-2]<<8);
  const out={len,cls:bytes[3],seq:bytes[4],ckOk:ck===got,msgs:[],table:'samyang'};
  const t0=bytes[5];
  if(dir==='L2B'&&(t0===0x05||t0===0x06)&&!(LAYOUT[t0]<=len-8)) LAYOUT[t0]=len-8;
  let msgs=tile(bytes,len,dir==='B2L'?SIZE_B2L:SIZE_L2B,dir);
  if(msgs&&msgs.some(m=>m.type===0x0A)) for(const k in LAYOUT) delete LAYOUT[k];

  out.msgs=msgs;

}

/* Un texte d'interface affiche par le script se pose par setTr : l'element garde la fonction qui l'ecrit (DYN), et la

 * bascule change la langue de ce qui est affiche, pas ce qui est affiche. Une valeur brute (setText) l'efface. */
const DYN=new Map();
const setText=(id,t)=>{ DYN.delete(id); const e=$(id); if(e&&e.textContent!==t) e.textContent=t; };
const setTr=(id,f)=>{ setText(id,f()); DYN.set(id,f); };
function applyLang(){

  document.querySelectorAll('[data-i18n-title]').forEach(e=>{ e.title=tr(e.dataset.i18nTitle); });

  document.querySelectorAll('#btnLang [data-lang]').forEach(e=>e.classList.toggle('on',e.dataset.lang===LANG));

/* LOG ALL (PROTOCOL.md, « LOG ALL ») : une trame entiere est la reference de son
 * sens et de son type (son 6e octet) ; « * rx|tx <t> ~<tt>[ s<hh>][ <o>=<hex>]… » en est la difference : le numero de
 * sequence (sinon celui de la reference plus le pas), les octets changes a partir de l'offset <o> compte apres l'octet de
 * type ; la longueur et la somme se recalculent. « * lost <n> » oublie les references. La page reconstruit la trame pour
 * la decoder comme une ligne entiere (la mise en page du 0x0A, les noms) ; le journal enregistre garde les lignes de la
 * carte telles quelles. */

 * d'un flux ne sert au suivant ; et a « * lost », ou la ligne perdue a pu etre un 0x0A. */
function forgetFrames(){ REFS.clear(); frags.clear(); for(const k in LAYOUT) delete LAYOUT[k]; }
const DIFF_RE=/^\* (rx|tx) (\d+) ~([0-9A-F]{2})(?: s([0-9A-F]{2}))?((?: \d+=(?:[0-9A-F]{2})+)*)$/;
/* La trame d'une ligne de difference : ses octets, null sans reference (ou incoherente), undefined pour une autre ligne. */
function diffFrame(text){
  if(text.startsWith('* lost ')){ forgetFrames(); return undefined; }
  const m=DIFF_RE.exec(text); if(!m) return undefined;
  const r=REFS.get(m[1]+':'+parseInt(m[3],16)); if(!r) return null;
  const b=r.bytes.slice(), len=b.length;
  if(m[4]!==undefined){ const s=parseInt(m[4],16); r.step=(s-b[4])&255; b[4]=s; } else b[4]=(b[4]+r.step)&255;
  for(const run of m[5].trim().split(' ').filter(x=>x)){
    const [o,h]=run.split('='); for(let k=0;k<h.length/2;k++){ const i=6+(+o)+k; if(i>=len-3){ REFS.delete(m[1]+':'+parseInt(m[3],16)); return null; } b[i]=parseInt(h.substr(2*k,2),16); }
  }
  let ck=0; for(let i=1;i<len-3;i++) ck=(ck+b[i])&0xFFFF; b[len-3]=ck&255; b[len-2]=ck>>8;
  r.bytes=b; return b;
}

  lines.push(t+' '+text); if(lines.length>20000) lines.splice(0,lines.length-20000);
  /* Les references de LOG ALL, les morceaux et la mise en page (LAYOUT, decodeFrame) sont suivis que la case « decoder

    const m=rebuilt!==undefined?[text,text.substr(2,2)]:/^\* (rx|tx|b2l) (\d+) (?:\+(\d+)\/(\d+)(?:#(\d+))? )?([0-9A-F]{2}(?: [0-9A-F]{2})*)$/.exec(text);
    if(rebuilt===null) extra='<div class="dec fld">↳ '+tr('dec.noRef')+'</div>';
    else if(m){

      if(!rebuilt&&!m[3]) bytes=m[6].split(' ').map(x=>parseInt(x,16));
      else if(!rebuilt){ /* fragment « +off/len#id » : reassemble par (sens, numero de trame) — a defaut d'id
                par (sens, horodatage, longueur) ; un nouveau debut (+0) remplace
                un assemblage incomplet, qui est signale perdu ; les trous restent des trous */

        if(!f){ f={bytes:new Array(total).fill(null),got:0}; frags.set(key,f); if(frags.size>32) frags.delete(frags.keys().next().value); }
        part.forEach((b,k)=>{ if(off+k<total&&f.bytes[off+k]===null){ f.bytes[off+k]=b; f.got++; } });
        if(f.got===total){ bytes=f.bytes; frags.delete(key); } else extra+='<div class="dec">↳ '+tr('dec.fragment',off,total,f.got)+'</div>';

/* ───────────── Port serie : une requete en vol, la ligne suivante (hors « * ») est la reponse.
 * Chaque connexion a une generation : une attente, une file ou une lecture d'une connexion
 * precedente ne touche jamais la suivante. Apres un timeout, la reponse de la commande
 * suivante est validee par sa forme ; ce qui n'y ressemble pas est une tardive, journalisee et
 * ignoree. Les reponses Moonlite (':…#' -> 'XXXX#', ':GV#' -> 2 octets) ont leur propre cadrage. ───────────── */
let port=null, reader=null, writer=null, queue=[], pumping=false, waiter=null, connGen=0;

const POLL_CMDS=/^([feoldz]|t)$/;
/* forme attendue de la reponse a une commande : un « ok », un nombre, y/n... ; null = tout */
function expectFor(cmd){
  const c=cmd[0];
  if(cmd.startsWith(':')) return null;
  if(/^[A-Z]/.test(cmd)) return /^(ok|er)\b/;
  if(cmd.length===1){
    if(c==='f') return /^(\d+|nc|er\b.*)$/;
    if(c==='e') return /^(y|n|nc|er\b.*)$/;
    if(c==='r') return /^(\d+-\d+|nc|er\b.*)$/;
    if(c==='a') return /^([\d.]+-[\d.]+|nc|er\b.*)$/;
    if(c==='o') return /^([\d.]+|nc|er\b.*)$/;
    if(c==='t') return /^ext=/;
    if(c==='v') return /^\d+\.\d+$/;
    if(c==='p') return /^(\d \d|er\b.*)$/;
    if(c==='g') return /^(ok|aborted|stall|unconfirmed|-)$/; /* PROTOCOL.md § 2 : repond dans tout etat */
    if(c==='q') return /^(ok|er\b.*)$/; /* PROTOCOL.md § 2 : ok, er nocap stop, er busy boot, er link … */
    if(c==='z') return /^(-?\d+\.\d\d \d+\.\d\d (-?\d+\.\d\d|-)|-)$/; /* PROTOCOL.md § 2 : <°C> <%RH> <seuil|->, ou - */
    return null;

}
let lastRxAt=0, needSync=false; /* lastRxAt : derniere ligne de reponse (hors « * ») ; needSync : apres un timeout, resynchroniser avant la commande suivante */
const MOON_MUTE=/^:(SN|SP|SD|SH|SF|SC|PO|C|\+|-|FG|FQ)/i; /* commandes Moonlite sans reponse : envoyees sans attente */
function onLine(line){
  if(line.startsWith('* ')){ addLine(/^\* (rx|b2l) /.test(line)?'rx':/^\* tx /.test(line)?'tx':'ev',line); return; }
  lastRxAt=Date.now(); /* une ligne de reponse, pas une ligne de journal « * » : elle seule rompt le silence de resync */
  if(waiter){
    if(waiter.expect&&!waiter.expect.test(line)){ addLine('err',tr('log.unexpected',waiter.cmd,line)); return; }
    const w=waiter; waiter=null; w.resolve(line); return;
  }

}
/* Une commande sur le fil, sa reponse ou null (timeout, deconnexion). Sans identifiant de requete,
 * la reponse tardive d'une commande expiree serait prise pour celle de la suivante quand elles ont
 * la meme forme (deux « ok », deux nombres) : apres un timeout, `needSync` impose une
 * resynchronisation (resync) avant la commande suivante. */
function send(cmd, quiet, gen){
  return new Promise(async res=>{
    if(!writer||gen!==connGen){ res(null); return; }
    const show=!(quiet||(POLL_CMDS.test(cmd)&&!$('fPoll').checked));
    if(show) addLine('cmd','> '+cmd);
    const moon=cmd.startsWith(':');
    if(moon&&MOON_MUTE.test(cmd)){ /* muette : rien a attendre, pas de faux timeout */
      try{ await writer.write(enc.encode(cmd)); res(''); }catch(e){ res(null); } return;
    }
    /* l'echeance et l'echec de l'ecriture ne touchent que CETTE attente (w) : l'ecriture peut echouer apres l'echeance,
       quand l'attente en place est deja celle de la commande suivante */
    const w={cmd,gen,expect:expectFor(cmd),moonFixed:moon&&/^:GV#$/i.test(cmd)?2:0,moon,
      resolve:l=>{ clearTimeout(timer); if(show) addLine(l.startsWith('er')?'err':'ok',l); res(l); },
      cancel:()=>{ clearTimeout(timer); res(null); }};
    const timer=setTimeout(()=>{ if(waiter===w){ waiter=null; needSync=true; if(show) addLine('err',tr('log.timeout',(moon?0.8:3).toLocaleString(loc()))); res(null); } },moon?800:3000);

/* Resynchronisation : la carte traite les lignes dans l'ordre, donc quand elle a repondu sa version
 * (« 1.3 ») a un `v` envoye APRES la commande expiree, toute reponse tardive de celle-ci est deja
 * passee (et a ete ignoree par la forme « x.y » attendue). On exige ensuite 100 ms de silence (PROTOCOL.md § 6) :
 * sans ligne de reponse ; les lignes de journal « * » ne le rompent pas (sous LOG ON/ALL, jusqu'a
 * 30 par seconde, il n'arriverait jamais). Pas de plafond : la
 * commande ne part pas avant ce silence. Trois `v` sans reponse : le canal reste a resynchroniser (needSync). */
async function resync(gen){
  for(let i=0;i<3&&gen===connGen;i++){
    const v=await send('v',true,gen);
    if(v===null) continue;
    while(gen===connGen&&Date.now()-lastRxAt<100) await sleep(105-(Date.now()-lastRxAt));
    needSync=false; return true;

/* Les deplacements du focus (PROTOCOL.md § 2 : f<n>, f±n, m<n>, jg ; Moonlite :FG#) : q les retire de la file. */
const MOVE_CMDS=/^(f[+-]?\d+|m\d+|jg|:FG#)$/i;
/* File des requetes, une seule en vol. « q » (arret) passe devant toute requete en attente,
 * scrutation comprise, et retire de la file les deplacements en attente (leur promesse rend null) :
 * sinon ils partiraient juste apres lui et le moteur repartirait. Il attend la requete en vol (sa reponse ou
 * son echeance). Apres une echeance, la resynchronisation est une etape de la file, jouee avant la
 * requete suivante quelle qu'elle soit, q compris : q ne recoit jamais la tardive d'une autre
 * commande (le « ok » d'un f<n> a sa forme). Sans echeance, q ne paie aucun retard. */
function ask(cmd, quiet){
  return new Promise(res=>{
    const job={cmd,quiet,res};
    if(cmd==='q'){
      const moves=queue.filter(j=>MOVE_CMDS.test(j.cmd)); queue=queue.filter(j=>!MOVE_CMDS.test(j.cmd));
      const k=queue.findIndex(j=>j.cmd!=='q'); queue.splice(k<0?queue.length:k,0,job);
      moves.forEach(j=>{ addLine('ev','[app] '+tr('log.qDropped',j.cmd)); j.res(null); });
    } else queue.push(job);

}
async function pump(){
  if(pumping) return;

  try{
    while(gen===connGen&&queue.length){
      /* une commande ne part jamais sur un canal non resynchronise : sans resynchronisation, elle rend null sans
         partir, et la suivante la retente */
      if(needSync&&!await resync(gen)){
        if(gen!==connGen||!queue.length) break;
        const job=queue.shift(); addLine('err','[app] '+tr('log.notSent',job.cmd)); job.res(null); continue;
      }
      if(gen!==connGen||!queue.length) break;
      const job=queue.shift(); /* relue apres la resync : un q arrive pendant passe devant */
      job.res(await send(job.cmd,job.quiet,gen));
    }
  }finally{ if(gen===connGen) pumping=false; }
}
/* (de)connexion : toute requete en attente rend null, une pompe de l'ancienne generation s'arrete seule */
function flushQueue(){ const q=queue; queue=[]; pumping=false; q.forEach(j=>j.res(null)); }
async function readLoop(gen){
  let buf='';
  const rd=reader;
  try{
    while(gen===connGen&&rd){
      const {value,done}=await rd.read();
      if(gen!==connGen) return; /* la connexion a change PENDANT la lecture : ces octets sont a l'ancienne, on ne les livre pas */
      if(done) break;
      buf+=dec.decode(value,{stream:true});
      for(;;){
        const w=waiter;
        if(buf.startsWith('*')){ /* ligne d'evenement « * … » : toujours terminee par \n, demultiplexee AVANT tout cadrage Moonlite (LOG ON pendant :GV#) */
          const i=buf.indexOf('\n'); if(i<0) break;
          const l=buf.slice(0,i).replace(/\r$/,''); buf=buf.slice(i+1); onLine(l); continue;
        }
        if(w&&w.moon){ /* Moonlite : 2 octets fixes (GV) ou jusqu'au '#' */
          if(w.moonFixed){ if(buf.length>=w.moonFixed){ const l=buf.slice(0,w.moonFixed); buf=buf.slice(w.moonFixed); onLine(l); continue; } break; }
          const k=buf.indexOf('#'); if(k>=0){ const l=buf.slice(0,k+1); buf=buf.slice(k+1); onLine(l); continue; } break;
        }
        { /* reponse Moonlite sans attente Moonlite (hex + '#', sans fin de ligne, PROTOCOL.md § 4) : la
             tardive d'une commande expiree. Cadree a son '#', jamais collee a la ligne qui suit ;
             c'est une ligne de reponse : elle rompt le silence. */
          const m=/^[0-9A-Fa-f]+#/.exec(buf);
          if(m){ buf=buf.slice(m[0].length); lastRxAt=Date.now(); addLine('err',tr('log.lateMoon',m[0])); continue; }
        }
        const i=buf.indexOf('\n'); if(i<0) break;
        const l=buf.slice(0,i).replace(/\r$/,''); buf=buf.slice(i+1);
        if(l.length) onLine(l);
      }
    }
  }catch(e){ if(gen===connGen&&port) addLine('err','[app] '+tr('log.readErr',e.message)); }
  if(gen===connGen&&port){ addLine('err','[app] '+tr('log.linkLost')); await disconnect(); }
}
/* Une seule connexion a la fois : le bouton est rendu inactif des le clic, avant requestPort et open (deux clics
 * ouvraient deux ports) ; connecting tient jusqu'a la fin de connect, reussie ou non. */
let connecting=false;
async function connect(){
  if(connecting||port) return;
  connecting=true; $('btnConnect').disabled=true;
  try{
    port=await navigator.serial.requestPort();
    await port.open({baudRate:115200});
    const gen=++connGen;
    writer=port.writable.getWriter(); reader=port.readable.getReader();
    /* Deux `v` au plus. L'ouverture du port peut redemarrer la carte : un `v` envoye pendant son
     * demarrage est perdu. Le second passe par la resynchronisation que son echeance impose
     * (PROTOCOL.md § 6 : jusqu'a 3 `v` de 3 s, puis 100 ms de silence), et ne part pas sans elle : une carte
     * muette se voit en 4 echeances de `v`, 12 s, et la page se deconnecte.
     * Une carte qui repond au premier `v` ne paie aucun retard. */
    flushQueue(); waiter=null; needSync=false;
    readLoop(gen);
    setTr('connTxt',()=>tr('conn.opening')); $('btnConnect').disabled=true; $('btnDisconnect').disabled=false;
    let v=await ask('v',true);
    if(v===null&&gen===connGen) v=await ask('v',true);
    if(gen!==connGen) return;
    if(v===null){ addLine('err','[app] '+tr('log.mute')); await disconnect(); return; }
    $('connDot').classList.add('on'); setTr('connTxt',()=>tr('conn.on'));
    /* `v` est la version du firmware de la carte ; la cause de son dernier redemarrage est dans DEBUG
     * (labo), lue une fois : un redemarrage de la carte fait tomber le port. */
    L.ver=v; addLine('ev','[app] '+tr('log.firmware',v));
    const dbg=parseKV(await ask('DEBUG',true)); if(gen!==connGen) return; L.reset=dbg.reset||null;
    await refreshAll(true); if(gen!==connGen) return;
    startPoll();
  }catch(e){ addLine('err','[app] '+e.message); await disconnect(); }
  finally{ connecting=false; }
}
async function disconnect(){
  connGen++;                       /* tout ce qui appartient a l'ancienne connexion est invalide */
  stopPoll(); busyPoll=false;
  if(waiter){ const w=waiter; waiter=null; w.cancel(); }
  flushQueue(); needSync=false; forgetFrames();
  const p=port, r=reader, wr=writer; port=reader=writer=null;
  try{ if(r){ await r.cancel().catch(()=>{}); r.releaseLock(); } }catch(e){}
  try{ if(wr){ wr.releaseLock(); } }catch(e){}
  try{ if(p) await p.close(); }catch(e){}
  $('connDot').classList.remove('on'); setTr('connTxt',()=>tr('conn.off')); $('btnConnect').disabled=false; $('btnDisconnect').disabled=true;
  L.present=L.fault=false; forgetLens(); setText('s_state','—'); showClimate(null);
}
$('btnConnect').onclick=connect; $('btnDisconnect').onclick=disconnect;
if(!('serial' in navigator)){ $('serialNote').hidden=false; $('btnConnect').disabled=true; }
$('cli').onsubmit=e=>{ e.preventDefault(); const c=$('cliIn').value.trim(); if(c){ ask(c); $('cliIn').value=''; } };

/* ───────────── Etat objectif (a partir de t, i, j, r, a, o, f, e) ─────────────
 * `t` ne porte que l'etat de la carte (ext, present, boot_state, busy, power_off, last_op, mf, oss, et ring, que la page
 * n'affiche qu'avec la ligne `t`) ; l'identite, la marque (`j`) et les bornes se lisent par leur lettre. Le
 * role de la bague suit le commutateur de l'objectif : la page ne le force pas. n, w, l (er nocap) et d (toujours -)
 * ne sont pas servis : la page ne les lit pas. */
/* moveWatch : un deplacement lance par la page (son `ok` recu), dont la fin (e -> n) fait lire `g` ; stopWatchUntil :
 * apres `aborted` ou `stall`, l'instant jusqu'ou `g` est relu, l'arret non confirme arrivant apres (PROTOCOL.md § 3 :
 * trois 0x1C, 4,5 s apres le premier). */
const L={present:false,fault:false,ext:false,ver:null,reset:null,pos:null,min:null,max:null,mark:null,moving:null,fnum:null,fmin:null,fmax:null,busy:'-',lastOp:'',moveWatch:false,stopWatchUntil:0};

const lensReady=()=>L.present&&!L.fault;
/* La ligne d'etat : FAULT avec sa raison (le jeton de last_op=boot:er:"<jeton>", § 5), sinon occupe ou pret. */
function stateText(t){
  const present=L.present, fault=L.fault, busy=L.busy;
  return ()=>{
    if(!present) return tr('state.absent',t.boot_state||'?');
    if(fault){ const m=/:er:"([^"]*)"$/.exec(t.last_op||''); return m?tr('state.faultWhy',m[1]):tr('state.fault'); }
    return busy!=='-'?tr('state.busy',busy):tr('state.ready');
  };
}
/* Ce qui n'est plus su (objectif retire ou en fault, deconnexion) s'affiche « — » et ne sert plus a calculer. */
function forgetLens(){
  L.pos=L.min=L.max=L.mark=L.fnum=L.fmin=L.fmax=L.moving=null; irisTarget=null; L.moveWatch=false; L.stopWatchUntil=0;
  focusDragging=irisDragging=false;
  setText('s_id','—'); setText('s_focus','—'); setText('s_moving',''); setText('s_fnum','f/—');
  setText('focusRangeVal','—'); irv.textContent='f/—'; fsl.classList.remove('pending'); isl.classList.remove('pending');
  applyPanels(); applyLimits();
}
const num=x=>(x===undefined||x===null||x==='-1'||x==='-')?null:parseInt(x,10);
/* cle=valeur ; une valeur peut contenir des segments entre guillemets, avec des espaces, n'importe
 * ou (id="Sony 24.0mm …", last_op=boot:er:"lost") ; les guillemets qui entourent
 * toute la valeur sont retires */
function parseKV(line){ const o={}; if(!line) return o; for(const m of line.matchAll(/(\w+)=((?:[^\s"]|"[^"]*")*)/g)){ const v=m[2]; o[m[1]]=/^"[^"]*"$/.test(v)?v.slice(1,-1):v; } return o; }
function isNum(s){ return typeof s==='string'&&/^-?\d+$/.test(s); }
async function refreshAll(announce){
  const gen=connGen; /* une continuation de l'ancienne connexion ne touche pas la nouvelle */
  const t=parseKV(await ask('t',true)); if(gen!==connGen) return;
  if(t.ext) setTr('s_board',boardLine(t));
  if(t.last_op) L.lastOp=t.last_op;
  setText('s_t',Object.entries(t).map(([k,v])=>k+'='+v).join(' ')||'—');
  L.present=t.present==='1'; L.fault=t.boot_state==='fault'; L.busy=t.busy||'-'; L.ext=t.ext==='1';
  setTr('s_power',powerLine(t)); { const ext=L.ext; setTr('s_caps',()=>ext?tr('caps.ext',t.ext):tr('caps.pinefeat')); }
  setTr('s_state',stateText(t));
  if(!lensReady()){ forgetLens(); return; }
  const i=await ask('i',true); if(gen!==connGen) return; setText('s_id',i&&!i.startsWith('er')?i:'—');
  const mk=await ask('j',true); if(gen!==connGen) return; L.mark=isNum(mk)?+mk:null;
  const r=await ask('r',true); if(gen!==connGen) return; let m=/^(\d+)-(\d+)$/.exec(r||'');
  if(m){ L.min=+m[1]; L.max=+m[2]; } else { L.min=L.max=null; }
  const a=await ask('a',true); if(gen!==connGen) return; m=/^([\d.]+)-([\d.]+)$/.exec(a||'');
  if(m){ L.fmin=+m[1]; L.fmax=+m[2]; } else { L.fmin=L.fmax=null; }
  applyPanels(); applyLimits();
  await pollSlow(); if(gen!==connGen) return; await pollFast(); if(gen!==connGen) return;
  if(announce) addLine('ev','[app] '+tr('log.ready',i&&!i.startsWith('er')?i:'-'));
}
/* Meme interface pour tout objectif : tout est actif des qu'un objectif est la. Ce que l'objectif
 * ne sert pas repond `er nocap …` dans le journal. La page ne porte que ce que la carte sert. */
function applyPanels(){
  const on=lensReady(), ap=on&&L.fmin!==null; /* l'ouverture se regle dans la plage lue (a) : sans elle, rien a calculer */
  document.querySelectorAll('#secFocus button, #secFocus input').forEach(e=>e.disabled=!on);
  document.querySelectorAll('#secIris button, #secIris input').forEach(e=>e.disabled=!ap);
  $('secFocus').style.opacity=on?'1':'.55'; $('secIris').style.opacity=ap?'1':'.55';
  if(on) setTr('irisBy',()=>tr('iris.by')); else setText('irisBy','');
}
function applyLimits(){
  const fr=$('focusRange');
  if(L.min!==null&&L.max!==null){
    fr.min=L.min; fr.max=L.max; $('focusTarget').min=L.min; $('focusTarget').max=L.max;
    const mn=L.min, mx=L.max; setTr('scMin',()=>tr('scale.near',mn.toLocaleString(loc()))); setTr('scMax',()=>tr('scale.far',mx.toLocaleString(loc())));
    $('scHome').style.display='none';
    const mk=$('scMark'), span=L.max-L.min; /* min = max : une seule position, a gauche (pas de division par zero) */
    if(L.mark!==null&&L.mark>=L.min&&L.mark<=L.max){ mk.style.left=(span>0?(L.mark-L.min)/span*100:0).toFixed(1)+'%'; mk.style.display=''; } else mk.style.display='none';
    setTr('focusHint',()=>tr('focus.hintLimits',mn,mx));
  } else { fr.min=0; fr.max=65535; $('focusTarget').min=0; $('focusTarget').max=65535; setTr('scMin',()=>tr('limits.unknown',0)); setText('scMax','65535'); $('scHome').style.display='none'; $('scMark').style.display='none'; setTr('focusHint',()=>tr('focus.hintUnknown')); }
  if(L.fmin!==null&&L.fmax!==null){
    const st=stopsFor(L.fmin,L.fmax); if(st.join()!==STOPS.join()){ STOPS=st; ir.max=STOPS.length-1; irisScale(); }
    { const a=L.fmin, b=L.fmax; setTr('s_irange',()=>tr('iris.range',a,b)); }
  } else setText('s_irange','—');
}

/* ───────────── Poll : f/e a 5 Hz ; z, t, r, j, o a 1 Hz ───────────── */
let pollTimer=null, slowTick=0, busyPoll=false;
/* Un rappel appartient a la connexion qui l'a lance : apres une (de)connexion, il ne continue pas (pas de pollSlow) et
 * ne rend pas busyPoll, qui est a la nouvelle. */
function startPoll(){ stopPoll(); const gen=connGen; pollTimer=setInterval(async()=>{ if(busyPoll||!writer||gen!==connGen) return; busyPoll=true; try{ await pollFast(); if(gen===connGen&&++slowTick%5===0) await pollSlow(); }finally{ if(gen===connGen) busyPoll=false; } },200); }
function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
/* La version vient de `v`, la cause du redemarrage de DEBUG (lus a la connexion), l'etat de `t`. */
function boardLine(t){ const ver=L.ver, reset=L.reset; return ()=>tr('board.fw',ver||'?')+(reset?tr('board.reset',reset):'')+tr('board.boot',t.boot_state)+(t.last_op&&t.last_op!=='-:ok'?tr('board.lastOp',t.last_op):''); }
function powerLine(t){ return ()=>t.power_off==='1'?tr('power.off'):''; }
async function pollFast(){
  if(!lensReady()) return;
  const gen=connGen;
  const f=await ask('f',true); if(gen!==connGen) return;
  if(isNum(f)){ L.pos=+f; setText('s_focus',f); focusSliderSet(+f); }
  else if(f==='nc'){ L.present=false; addLine('err','[app] '+tr('log.lensGone')); await refreshAll(); return; }
  const e=await ask('e',true); if(gen!==connGen) return; L.moving=(e==='y')?true:(e==='n'?false:null); { const mv=L.moving; setTr('s_moving',()=>mv===true?tr('move.moving'):(mv===null?tr('move.unknown',e===null?tr('move.noReply'):e):'')); }
  if(e==='n'&&L.moveWatch){ L.moveWatch=false; await moveEnd(gen); }
}
/* La fin d'un deplacement lance par la page : `g` (PROTOCOL.md § 2), pas DEBUG (decision de l'humain : DEBUG n'est pas
 * une interface de production). Toute autre reponse qu'`ok` est signalee, au journal et dans le panneau Focus :
 * `aborted` comme un arret demande (un evenement : une annulation n'est pas un echec, PROTOCOL.md § 2, ligne q), le reste
 * (stall, unconfirmed, -, pas de reponse) comme une erreur. */
async function moveEnd(gen){
  const g=await ask('g',true); if(gen!==connGen) return;
  L.stopWatchUntil=(g==='aborted'||g==='stall')?Date.now()+6000:0;
  if(g==='ok'){ setText('s_move',''); return; }
  moveReport(g);
}
function moveReport(g){ const stop=g==='aborted', w=()=>g===null?tr('move.noG'):stop?tr('move.stopped'):g; addLine(stop?'ev':'err','[app] '+tr('log.moveEnd',w())); setTr('s_move',()=>tr('move.last',w())); $('s_move').style.color=stop?'':'var(--bad)'; }
/* `z` (PROTOCOL.md § 2) : la temperature, l'humidite et le seuil de condensation que la carte calcule, affiches tels
 * quels (le seuil n'est pas recalcule ici : le meme chiffre que le driver INDI) ; le seuil est un point de rosee s'il est
 * positif ou nul, de givre s'il est negatif. Ce que la carte ne connait pas (`-`), ou une autre reponse, s'affiche « — ».
 * Lu a 1 Hz, objectif ou non. */
function showClimate(z){
  const m=/^(-?\d+\.\d\d) (\d+\.\d\d) (-?\d+\.\d\d|-)$/.exec(z||''), c=m&&m[3]!=='-'?m[3]:null;
  const n=v=>(+v).toLocaleString(loc(),{minimumFractionDigits:2,maximumFractionDigits:2});
  if(m){ setTr('s_temp',()=>tr('unit.celsius',n(m[1]))); setTr('s_rh',()=>tr('unit.rh',n(m[2]))); } else { setText('s_temp','—'); setText('s_rh','—'); }
  if(c!==null) setTr('s_cond',()=>tr('unit.celsius',n(c))); else setText('s_cond','—');
  setTr('k_cond',()=>c===null?tr('kv.cond'):+c<0?tr('kv.frost'):tr('kv.dew'));
}
async function pollSlow(){
  const gen=connGen;
  const z=await ask('z',true); if(gen!==connGen) return; showClimate(z);
  const t=parseKV(await ask('t',true)); if(gen!==connGen) return;
  const wasPresent=L.present, wasBusy=L.busy, hadLimits=L.min!==null;
  L.busy=t.busy||'-';
  if(t.last_op&&t.last_op!==L.lastOp){ L.lastOp=t.last_op; if(t.last_op!=='-:ok'&&!t.last_op.endsWith(':ok')) addLine('err','[app] '+tr('log.lastOp',t.last_op)); else if(t.last_op!=='-:ok') addLine('ev','[app] '+tr('log.lastOp',t.last_op)); }
  if((t.present==='1')!==wasPresent||(t.boot_state==='fault')!==L.fault){ await refreshAll(true); return; }
  setTr('s_power',powerLine(t)); setTr('s_state',stateText(t));
  if(t.ext) setTr('s_board',boardLine(t));
  if(!lensReady()) return;
  if(wasBusy!=='-'&&L.busy==='-'){ await refreshAll(false); return; } /* fin d'un demarrage (busy=boot) : identite, bornes, plage fraiches */
  { /* bornes, marque : par leur lettre (`r`, `j`), pas dans `t` */
    const r=await ask('r',true); if(gen!==connGen) return; const rm=/^(\d+)-(\d+)$/.exec(r||''), tmin=rm?+rm[1]:null, tmax=rm?+rm[2]:null;
    const mk=await ask('j',true); if(gen!==connGen) return; const tmark=isNum(mk)?+mk:null; if(tmark!==L.mark){ L.mark=tmark; applyLimits(); }
    if(tmin!==L.min||tmax!==L.max){ L.min=tmin; L.max=tmax; applyPanels(); applyLimits();
      if(tmin===null&&hadLimits) addLine('ev','[app] '+tr('limits.unknown',r||tr('move.noReply'))); } }
  const o=await ask('o',true); if(gen!==connGen) return; L.fnum=o&&/^[\d.]+$/.test(o)?+o:null; irisRefresh();
  if(L.stopWatchUntil&&Date.now()<L.stopWatchUntil){ /* un arret pas encore confirme : g peut passer a unconfirmed */
    const g=await ask('g',true); if(gen!==connGen) return;
    if(g==='unconfirmed'){ L.stopWatchUntil=0; moveReport(g); }
  } else L.stopWatchUntil=0;
  setText('s_t',Object.entries(t).map(([k,v])=>k+'='+v).join(' '));
}

/* ───────────── Focus ───────────── */
const fr=$('focusRange'), fsl=$('focusSlider');
/* Un glissement va de pointerdown au relachement. Valeur changee : `change` lance le deplacement et le termine. Relache
 * sans changer de valeur (pas de `change`), ou annule (pointercancel) : il se termine la, et le curseur reprend la
 * position (focus) ou l'ouverture rapportee. Ecoute sur le document : le relachement peut tomber hors du curseur. */
let focusDragging=false, focusDown=null;
function focusSliderSet(v){ if(focusDragging||isNaN(v)||fr.disabled) return; fr.value=Math.max(+fr.min,Math.min(+fr.max,v)); setTr('focusRangeVal',()=>v+' '+tr('unit.steps')); fsl.classList.remove('pending'); }
fr.addEventListener('pointerdown',()=>{ focusDragging=true; focusDown=fr.value; });
fr.addEventListener('input',()=>{ focusDragging=true; setText('focusRangeVal','→ '+fr.value); fsl.classList.add('pending'); $('focusTarget').value=fr.value; });
fr.addEventListener('change',async()=>{ focusDragging=false; await focusGoto(parseInt(fr.value,10)); });
/* Un deplacement de la page : accepte (`ok`), sa fin est suivie (moveWatch) ; un nouveau deplacement efface le
 * resultat du precedent et arrete la surveillance de son arret (la carte l'arrete aussi, PROTOCOL.md § 3). */
async function move(cmd){ const r=await ask(cmd); if(r==='ok'){ L.moveWatch=true; L.stopWatchUntil=0; setText('s_move',''); } return r; }
async function focusGoto(t){ if(isNaN(t)) return; const r=await move('f'+t); if(r!=='ok'){ addLine('err','[app] '+tr('log.moveRefused',r)); fsl.classList.remove('pending'); } }
$('btnFgoto').onclick=()=>focusGoto(parseInt($('focusTarget').value,10));
$('btnFm100').onclick=()=>move('f-100'); $('btnFm10').onclick=()=>move('f-10'); $('btnFp10').onclick=()=>move('f+10'); $('btnFp100').onclick=()=>move('f+100');
$('btnStop').onclick=()=>ask('q');
$('btnMarkSet').onclick=()=>ask('js'); $('btnMarkGo').onclick=()=>move('jg');
$('btnReboot').onclick=()=>ask('b'); $('btnPowerOff').onclick=()=>ask('p0'); $('btnPowerOn').onclick=()=>ask('p1');

/* ───────────── Ouverture : tiers de diaphragme ───────────── */
/* les crans usuels : ceux de la table `thirds` de host.c (f/ x10), f/45 compris */
const FSTOPS=[1,1.1,1.2,1.4,1.6,1.8,2,2.2,2.5,2.8,3.2,3.5,4,4.5,5,5.6,6.3,7.1,8,9,10,11,13,14,16,18,20,22,25,29,32,36,40,45];
let STOPS=FSTOPS.slice(5);
/* les crans entre les bornes lues (a), les bornes comprises meme hors cran : le curseur atteint l'une et l'autre */
function stopsFor(fmin,fmax){ const r=FSTOPS.filter(f=>f>=fmin-0.05&&f<=fmax+0.05); if(!r.length||Math.abs(r[0]-fmin)>0.05) r.unshift(fmin); if(Math.abs(r[r.length-1]-fmax)>0.05) r.push(fmax); return r; }
function stopIdx(f){ let b=0,d=1e9; STOPS.forEach((x,i)=>{ const e=Math.abs(x-f); if(e<d){d=e;b=i;} }); return b; }
const ir=$('irisRange'), irv=$('irisRangeVal'), isl=$('irisSlider');
let irisDragging=false, irisDown=null, irisTarget=null;
function irisScale(){ const s=isl.querySelector('.stops'), n=STOPS.length-1; s.innerHTML=''; STOPS.forEach((f,i)=>{ if(i%3===0||i===n){ const e=document.createElement('span'); e.style.left=(n>0?i/n*100:0)+'%'; e.textContent=f; s.appendChild(e); } }); }
irisScale(); ir.max=STOPS.length-1;
function irisRefresh(){
  const reached=irisTarget!==null&&L.fnum!==null&&Math.abs(L.fnum-irisTarget)<=0.05;
  setText('s_fnum',(L.fnum!==null?'f/'+L.fnum:'f/—')+(irisTarget!==null&&!reached?' → f/'+irisTarget:''));
  if(reached){ isl.classList.remove('pending'); irisTarget=null; }
  if(!irisDragging&&L.fnum!==null&&irisTarget===null) ir.value=stopIdx(L.fnum);
  if(!irisDragging) irv.textContent=L.fnum===null&&irisTarget===null?'f/—':'f/'+STOPS[+ir.value];
}
ir.addEventListener('pointerdown',()=>{ irisDragging=true; irisDown=ir.value; });
function dragEnd(cancel){
  if(focusDragging&&(cancel||fr.value===focusDown)){ focusDragging=false; fsl.classList.remove('pending'); if(L.pos!==null) focusSliderSet(L.pos); else setText('focusRangeVal','—'); }
  if(irisDragging&&(cancel||ir.value===irisDown)){ irisDragging=false; if(irisTarget===null) isl.classList.remove('pending'); irisRefresh(); }
}
document.addEventListener('pointerup',()=>dragEnd(false)); document.addEventListener('pointercancel',()=>dragEnd(true));
ir.addEventListener('input',()=>{ irisDragging=true; irv.textContent='→ f/'+STOPS[+ir.value]; isl.classList.add('pending'); });
ir.addEventListener('change',async()=>{ irisDragging=false; await irisGoto(STOPS[+ir.value]); });
async function irisGoto(f){ if(L.fmin===null){ addLine('err','[app] '+tr('log.irisRangeUnknown')); return; } irisTarget=f; isl.classList.add('pending'); const r=await ask('a'+f); if(r!=='ok'){ addLine('err','[app] '+tr('log.irisRefused',r)); irisTarget=null; isl.classList.remove('pending'); } }
$('btnIopen').onclick=()=>irisGoto(STOPS[0]);
/* ±⅓ depuis l'ouverture rapportee (o) : inconnue, rien a calculer */
function irisStep(d){ if(L.fnum===null){ addLine('err','[app] '+tr('log.irisUnknown')); return; } return irisGoto(STOPS[Math.max(0,Math.min(STOPS.length-1,stopIdx(L.fnum)+d))]); }
$('btnIm').onclick=()=>irisStep(-1);
$('btnIp').onclick=()=>irisStep(1);

/* ───────────── Journal de la carte ───────────── */
$('btnLogOn').onclick=()=>ask('LOG ON'); $('btnLogAll').onclick=()=>ask('LOG ALL'); $('btnLogOff').onclick=()=>ask('LOG OFF');

/* ───────────── Langue : les textes de depart, la bascule ───────────── */
setTr('connTxt',()=>tr('conn.off')); setTr('scMin',()=>tr('scale.unknown')); setTr('focusHint',()=>tr('focus.hint'));
$('btnLang').onclick=()=>setLang(LANG==='fr'?'en':'fr');
showClimate(null);
applyLang();
</script>
</body>
</html>

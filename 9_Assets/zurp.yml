name: Basilisk
tagline: >-
  A Sony E adapter for astro cameras: focus and aperture driven from Ekos or ASCOM, over a single
  USB-C cable.
slogan: Bend the glass to your will
category: Adapter
section: gadgets
status: released
basedOn: Pinefeat

description:
  - >-
    Basilisk is a Sony E adapter for astro cameras: it plays the camera body for a Sony E lens, and
    drives its focus and aperture from Ekos/INDI or ASCOM over a single USB-C cable.
  - >-
    Based on the Pinefeat project, with the zUrp treatment. Open hardware like the rest of the
    catalog.

poster: basilisk.webp
posterAlt: >-
  Basilisk poster on a worn, chipped cream plate: a mechanical serpent with segmented steel coils
  and green crystal spines, a glowing green eye and a forked tongue, rears with fangs bared in front
  of the full moon, green rays and blueprint sketches of its head, above the slogan “Bend the glass
  to your will”.

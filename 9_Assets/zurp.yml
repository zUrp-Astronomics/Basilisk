name: Basilisk
tagline: Focus et diaphragme des objectifs Sony E sur caméra astro. Un câble USB-C.
slogan: Bend the glass to your will
category: Adapter
section: gadgets
status: released
basedOn: Pinefeat
description:
- Dix-huit millimètres de la monture au capteur. Basilisk y case contacts, contrôleur et USB autour de
  la caméra astro, et pilote focus et diaphragme depuis Ekos/INDI ou ASCOM.
- Une carte sur mesure, un boîtier imprimé, un fût Meike. À partir de Pinefeat, avec les fichiers de fabrication,
  le firmware et une référence E-mount dans le dépôt.
poster: basilisk.webp
posterAlt: 'Affiche Basilisk sur plaque crème usée : un serpent mécanique aux épines vertes, crocs sortis
  devant la pleine lune et des plans techniques.'
accent: '#05b40e'

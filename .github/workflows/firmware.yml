# SOURCE: ticket #612 — le firmware construit sur GitHub ; ticket #617 — publié sur la release d'un tag v*.*.* ;
#         ticket #626 — la release porte aussi le zip de flash qui garde la marque ;
#         ticket #628 — les actions passent sous Node 24 (checkout@v7, upload-artifact@v7, download-artifact@v8,
#         action-gh-release@v3) ; ticket #630 — le site sert le bouton d'installation de la page produit (commentaire
#         seul) ; ticket #633 — la release porte aussi la page de banc ; ticket #670 — les fichiers de la release et le
#         manifeste portent la version, le tag sans son « v » (norme de l'org)
# AUTHOR: engineer
# DATE: 2026-10-20
# STATUS: actif, actions sous Node 24 — ne tourne que sur GitHub ; la forge ne lit que .gitea/workflows/
#
# ⚠ ON CHANGE L'UN, ON CHANGE L'AUTRE. Le job `build` est la copie du job `firmware-build` de .gitea/workflows/ci.yml :
# même image (espressif/idf:v5.3.2), même 4_Firmware/build.sh, même artefact (firmware-esp32c3). Il n'en diffère que
# par le runner : actions/checkout et ubuntu-latest + `container:`, sans les contournements de Gitea (clone manuel
# avec le jeton, node posé pour upload-artifact, `runs-on: shell`). Une image, un script ou un artefact changés
# là-bas se changent ici dans le même commit, et inversement.
#
# Aucun test : les suites tournent sur la forge (décision de l'humain).
#
# La publication suit la norme de l'org (celle d'ESPHome, WLED, Tasmota). Son seul déclencheur est la poussée d'un tag
# v*.*.* ; le tag est posé par Starfleet, sous le compte de l'humain (un tag poussé avec le GITHUB_TOKEN ne
# déclencherait rien). Une poussée de branche construit seulement. La release s'appelle comme le tag (v1.0.1) ; ses
# fichiers portent la version, le tag sans son « v » (1.0.1), comme le "version" du manifeste : la norme de l'org,
# <produit>_<version>_<cible> (ticket #670 ; la v1.0.0 s'en écartait). Le job `release`, sur le tag :
#   1. renomme l'image fusionnée de l'artefact, basilisk_FW-v<PROJECT_VER>-esp32c3-full.bin, en
#      basilisk_<version>_esp32c3.bin, et écrit à côté manifest.json (4_Firmware/manifest.py, format ESP Web Tools ;
#      le site le copie avec l'image pour le bouton d'installation de la page produit, ticket #630). manifest.json
#      garde ce nom à chaque release : le site retient pour l'installation la release qui le porte ;
#   2. met dans basilisk_<version>_esp32c3_flash.zip (ticket #626), à plat et tels quels, les fichiers de l'artefact qui
#      flashent sans effacer la marque : flash_args, les trois .bin qu'il liste, flash.sh, flash.cmd. Le zip se fait
#      ici, sur l'artefact téléchargé : le job `build` n'en sait rien ;
#   3. copie telle quelle la page de banc du commit tagué, 5_App/emount-bench.html, en
#      basilisk_<version>_bench.html (ticket #633). Le site la reconnaît au suffixe exact _bench.html, dans la release
#      qu'il retient pour l'installation, celle qui porte manifest.json ; deux *_bench.html dans une release, et il
#      n'en publie aucun : celui-ci est le seul ;
#   4. crée la release du tag, à son nom, avec ces quatre fichiers et eux seuls ;
#   5. réveille le site de l'org (dispatch zurp-catalog, secret d'org ZURP_SITE_DISPATCH) : une release créée avec le
#      GITHUB_TOKEN ne déclenche pas zurp-site.yml. Le site copie alors manifest.json et l'image de la dernière release
#      et sert le bouton d'installation de la page produit ; il y copiera aussi le banc, quand il le publie (ticket
#      site #105).
# La procédure de flash, sur ces fichiers, est dans README.md § Flash.
# Un run en échec se relance depuis GitHub.
name: Firmware

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # Comme sur la forge, git est déclaré sûr : le dépôt monté n'appartient pas à root, l'utilisateur du conteneur.
      # L'image fixe IDF_PATH mais son entrypoint (qui source export.sh) est court-circuité par le runner : on charge
      # l'environnement ESP-IDF nous-mêmes.
      - name: Build ESP-IDF (firmware, esp32c3)
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh" > /dev/null
          bash 4_Firmware/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-esp32c3
          path: 4_Firmware/build/esp32c3/artefact/
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: La version, le tag sans son « v »
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: firmware-esp32c3
          path: artefact
      - name: L'image renommée et son manifest.json
        run: |
          set -euo pipefail
          images=(artefact/*-esp32c3-full.bin)
          if [ ${#images[@]} -ne 1 ] || [ ! -f "${images[0]}" ]; then
            echo "::error::il faut une image fusionnée …-esp32c3-full.bin dans l'artefact, une seule"
            exit 1
          fi
          mkdir release
          cp "${images[0]}" "release/basilisk_${VERSION}_esp32c3.bin"
          python3 4_Firmware/manifest.py "$VERSION" "basilisk_${VERSION}_esp32c3.bin" > release/manifest.json
          cat release/manifest.json
      # Les noms des .bin sont pris dans flash_args, qui les place : le zip porte ce que le script écrit, rien d'autre.
      # Chaque fichier est vérifié présent AVANT zip : zip saute un nom absent (avertissement) et rend 0, il publierait
      # un zip partiel (revue de la PR #627).
      - name: Le zip qui garde la marque
        run: |
          set -euo pipefail
          bins=$(awk 'NR > 1 && NF == 2 { print $2 }' artefact/flash_args)
          if [ "$(echo "$bins" | wc -l)" -ne 3 ]; then
            echo "::error::flash_args doit lister trois fichiers : bootloader, table de partitions, application"
            exit 1
          fi
          for f in flash_args flash.sh flash.cmd $bins; do
            if [ ! -f "artefact/$f" ]; then
              echo "::error::$f manque dans l'artefact : pas de zip partiel"
              exit 1
            fi
          done
          (cd artefact && zip -X -j "../release/basilisk_${VERSION}_esp32c3_flash.zip" \
            flash_args flash.sh flash.cmd $bins)
          unzip -l "release/basilisk_${VERSION}_esp32c3_flash.zip"
      # cp échoue si la page manque : pas de release sans son banc.
      - name: Le banc
        run: |
          set -euo pipefail
          cp 5_App/emount-bench.html "release/basilisk_${VERSION}_bench.html"
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: |
            release/basilisk_${{ env.VERSION }}_esp32c3.bin
            release/manifest.json
            release/basilisk_${{ env.VERSION }}_esp32c3_flash.zip
            release/basilisk_${{ env.VERSION }}_bench.html
          fail_on_unmatched_files: true
      - name: Le dispatch au site
        env:
          GH_TOKEN: ${{ secrets.ZURP_SITE_DISPATCH }}
        run: gh api repos/zUrp-Astronomics/zurp-astronomics.github.io/dispatches -f event_type=zurp-catalog
